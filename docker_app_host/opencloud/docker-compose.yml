services:
  opencloud:
    container_name: opencloud
    image: opencloudeu/opencloud:7.2.5@sha256:26fcc6f69d71937af015be73c585e7c36d1945d547fa2a6f706118283f1bcd6b
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=America/New_York
      - OC_URL=https://opencloud.${SECRET_INTERNAL_DOMAIN_NAME}
    env_file:
      - /custom/files/opencloud.env
    user: '5001:5001'
    networks:
      - proxy
    volumes:
      - 'opencloud_config:/etc/opencloud'
      - 'opencloud_data:/var/lib/opencloud'
    # "init" writes /etc/opencloud/opencloud.yaml with random secrets on first run,
    # then fails harmlessly on every later run because the file already exists
    entrypoint:
      - /bin/sh
    command: ["-c", "opencloud init || true; opencloud server"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.opencloud.rule=Host(`opencloud.${SECRET_INTERNAL_DOMAIN_NAME}`)
      - traefik.http.routers.opencloud.tls=true
      - traefik.http.routers.opencloud.tls.certresolver=cloudflare
      - traefik.http.routers.opencloud.entrypoints=websecure
      - traefik.http.services.opencloud.loadbalancer.server.port=9200
      - traefik.http.routers.opencloud.middlewares=opencloud_headers
      - traefik.http.middlewares.opencloud_headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.opencloud_headers.headers.stsPreload=true
      - traefik.http.middlewares.opencloud_headers.headers.stsSeconds=31536000
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

networks:
  proxy:
    external: true

volumes:
  opencloud_config:
    driver: local
  opencloud_data:
    driver: local
