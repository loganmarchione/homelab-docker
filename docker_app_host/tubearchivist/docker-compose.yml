services:
  tubearchivist:
    container_name: tubearchivist
    image: bbilly1/tubearchivist:v0.5.12@sha256:ba1c846ddd0c6fdd0f040727129d2466e03b7a0c26499223839d450c7586ac09
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    env_file:
      - /custom/files/tubearchivist.env
    networks:
      - proxy
      - tubearchivist
    depends_on:
      - tubearchivist-elasticsearch
      - tubearchivist-redis
    volumes:
      - 'tubearchivist_cache:/cache'
      # The directory below is huge, so storing it on the NAS
      - '/custom_mounts/media/library/YouTube:/youtube'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.tubearchivist.rule=Host(`tubearchivist.${SECRET_INTERNAL_DOMAIN_NAME}`)
      - traefik.http.routers.tubearchivist.tls=true
      - traefik.http.routers.tubearchivist.tls.certresolver=cloudflare
      - traefik.http.routers.tubearchivist.entrypoints=websecure
      - traefik.http.services.tubearchivist.loadbalancer.server.port=8000
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
  tubearchivist-redis:
    container_name: tubearchivist-redis
    image: redis:8.10.2@sha256:c94085d298b738be22c9ccdc0ac3761fa6649df7dd82ad1d42367f3cb9714935
    restart: unless-stopped
    networks:
      - tubearchivist
    depends_on:
      - tubearchivist-elasticsearch
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SETPCAP
  tubearchivist-elasticsearch:
    container_name: tubearchivist-elasticsearch
    image: elasticsearch:8.19.22@sha256:909a569c9c973d1de81cee7a002b69e65726f8d6317de4627ccfeb690a6d0ccb
    restart: unless-stopped
    environment:
      - TZ=UTC
    env_file:
      - /custom/files/tubearchivist.env
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - tubearchivist
    volumes:
      - 'elasticsearch_data:/usr/share/elasticsearch/data'
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?pretty | grep -q '\"status\" : \"green\"\\|\"status\" : \"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

networks:
  tubearchivist:
  proxy:
    external: true

volumes:
  tubearchivist_cache:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
