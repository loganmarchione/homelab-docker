---
name: Lint

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shellcheck

    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y shellcheck
          shellcheck --version

      - name: Lint
        run: |
          grep -rl '^#!/.*sh' * | xargs -n1 shellcheck -e SC2059

  yamllint:
    name: yamllint

    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yamllint
        run: |
          python3 --version
          pip3 install --user yamllint
          yamllint --version

      - name: List files to yamllint
        run: |
          yamllint --list-files .

      - name: Run yamllint
        run: |
          yamllint .

  dclint:
    name: dclint

    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint the compose files
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1.6.0
        with:
          path: ./docker_app_host/
          recursive: true
